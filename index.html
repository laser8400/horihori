<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>タイムコード秒数計算トレーニング</title>
<style>
  body {
    font-family: 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    background-color: #eef2f5;
  }
  .container {
    background: white;
    padding: 40px;
    border-radius: 12px;
    box-shadow: 0 8px 16px rgba(0,0,0,0.1);
    text-align: center;
    width: 100%;
    max-width: 450px;
  }
  h1 { 
    font-size: 22px; 
    color: #333; 
    margin-bottom: 30px;
  }
  .problem-box {
    background-color: #f8f9fa;
    border: 2px dashed #ccc;
    border-radius: 8px;
    padding: 20px;
    margin-bottom: 20px;
  }
  .time-display {
    font-size: 40px;
    font-weight: bold;
    letter-spacing: 3px;
    color: #222;
  }
  .arrow {
    font-size: 24px;
    color: #888;
    margin: 10px 0;
  }
  .input-area { 
    margin: 25px 0; 
  }
  input[type="number"] {
    font-size: 28px;
    width: 120px;
    text-align: center;
    padding: 10px;
    border: 2px solid #007bff;
    border-radius: 8px;
    outline: none;
  }
  input[type="number"]:focus {
    box-shadow: 0 0 8px rgba(0,123,255,0.5);
  }
  .unit {
    font-size: 24px;
    font-weight: bold;
    margin-left: 10px;
    color: #555;
  }
  button {
    font-size: 18px;
    font-weight: bold;
    padding: 12px 30px;
    margin: 10px 5px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: 0.2s;
  }
  #check-btn { 
    background-color: #007bff; 
    color: white; 
  }
  #check-btn:hover { background-color: #0056b3; }
  #next-btn { 
    background-color: #dc3545; /* 画像の赤ペンのような色 */
    color: white; 
    display: none; 
  }
  #next-btn:hover { background-color: #c82333; }
  
  .result {
    font-size: 22px;
    font-weight: bold;
    margin-top: 20px;
    min-height: 35px;
  }
  .correct { color: #dc3545; }
  .incorrect { color: #0056b3; }
</style>
</head>
<body>

<div class="container">
  <h1>タイムコード引き算 練習</h1>
  
  <div class="problem-box">
    <div class="time-display" id="time1">0:00</div>
    <div class="arrow">↓</div>
    <div class="time-display" id="time2">0:00</div>
  </div>

  <div class="input-area">
    <input type="number" id="user-answer" placeholder="?" autocomplete="off">
    <span class="unit">秒</span>
  </div>

  <div>
    <button id="check-btn" onclick="checkAnswer()">答え合わせ</button>
    <button id="next-btn" onclick="generateProblem()">次の問題へ</button>
  </div>

  <div id="result-message" class="result"></div>
</div>

<script>
  let currentAnswer = 0;

  function generateProblem() {
    // 0分〜9分の間でランダムに開始時間を決定
    const min1 = Math.floor(Math.random() * 10);
    const sec1 = Math.floor(Math.random() * 60);
    const totalSec1 = min1 * 60 + sec1;
    
    // 画像の傾向に合わせ、数秒〜90秒程度の間で差分（答え）をランダム生成
    currentAnswer = Math.floor(Math.random() * 85) + 4; 
    const totalSec2 = totalSec1 + currentAnswer;
    
    const min2 = Math.floor(totalSec2 / 60);
    const sec2 = totalSec2 % 60;
    
    // mm:ss 形式にフォーマット
    const formatTime = (m, s) => m + ":" + s.toString().padStart(2, '0');
    
    document.getElementById('time1').innerText = formatTime(min1, sec1);
    document.getElementById('time2').innerText = formatTime(min2, sec2);
    
    // UIのリセット
    const inputField = document.getElementById('user-answer');
    inputField.value = '';
    document.getElementById('result-message').innerText = '';
    document.getElementById('check-btn').style.display = 'inline-block';
    document.getElementById('next-btn').style.display = 'none';
    inputField.focus();
  }

  function checkAnswer() {
    const userAnswer = parseInt(document.getElementById('user-answer').value, 10);
    const resultMsg = document.getElementById('result-message');
    
    if (isNaN(userAnswer)) {
      resultMsg.innerText = "秒数を入力してください";
      resultMsg.className = "result incorrect";
      return;
    }
    
    if (userAnswer === currentAnswer) {
      resultMsg.innerText = "大正解！ （" + currentAnswer + "秒）";
      resultMsg.className = "result correct";
      document.getElementById('check-btn').style.display = 'none';
      document.getElementById('next-btn').style.display = 'inline-block';
      document.getElementById('next-btn').focus();
    } else {
      resultMsg.innerText = "惜しい！もう一度計算してみよう";
      resultMsg.className = "result incorrect";
      document.getElementById('user-answer').focus();
    }
  }

  // Enterキーを押した時の動作をサポート（快適に連続解答できるように）
  document.getElementById('user-answer').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') {
      if (document.getElementById('check-btn').style.display !== 'none') {
        checkAnswer();
      }
    }
  });

  // 初回読み込み時に1問目を生成
  window.onload = generateProblem;
</script>

</body>
</html>
