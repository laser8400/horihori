<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>タイムコード秒数計算トレーニング</title>
<style>
  body {
    font-family: 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    background-color: #eef2f5;
  }
  .container {
    background: white;
    padding: 40px;
    border-radius: 12px;
    box-shadow: 0 8px 16px rgba(0,0,0,0.1);
    text-align: center;
    width: 100%;
    max-width: 450px;
  }
  h1 { 
    font-size: 22px; 
    color: #333; 
    margin-bottom: 30px;
  }
  .problem-box {
    background-color: #f8f9fa;
    border: 2px dashed #ccc;
    border-radius: 8px;
    padding: 20px;
    margin-bottom: 20px;
  }
  .time-display {
    font-size: 40px;
    font-weight: bold;
    letter-spacing: 3px;
    color: #222;
  }
  .arrow {
    font-size: 24px;
    color: #888;
    margin: 10px 0;
  }
  .input-area { 
    margin: 25px 0;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;
  }
  input[type="number"] {
    font-size: 28px;
    width: 80px;
    text-align: center;
    padding: 10px;
    border: 2px solid #007bff;
    border-radius: 8px;
    outline: none;
  }
  input[type="number"]:focus {
    box-shadow: 0 0 8px rgba(0,123,255,0.5);
  }
  .unit {
    font-size: 24px;
    font-weight: bold;
    color: #555;
  }
  button {
    font-size: 18px;
    font-weight: bold;
    padding: 12px 30px;
    margin: 10px 5px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: 0.2s;
  }
  #check-btn { 
    background-color: #007bff; 
    color: white; 
  }
  #check-btn:hover { background-color: #0056b3; }
  #next-btn { 
    background-color: #dc3545; 
    color: white; 
    display: none; 
  }
  #next-btn:hover { background-color: #c82333; }
  
  .result {
    font-size: 22px;
    font-weight: bold;
    margin-top: 20px;
    min-height: 35px;
  }
  .correct { color: #dc3545; }
  .incorrect { color: #0056b3; }
</style>
</head>
<body>

<div class="container">
  <h1>タイムコード引き算 練習</h1>
  
  <div class="problem-box">
    <div class="time-display" id="time1">0:00</div>
    <div class="arrow">↓</div>
    <div class="time-display" id="time2">0:00</div>
  </div>

  <div class="input-area">
    <input type="number" id="user-min" placeholder="0" min="0" autocomplete="off">
    <span class="unit">分</span>
    <input type="number" id="user-sec" placeholder="0" min="0" max="59" autocomplete="off">
    <span class="unit">秒</span>
  </div>

  <div>
    <button id="check-btn" onclick="checkAnswer()">答え合わせ</button>
    <button id="next-btn" onclick="generateProblem()">次の問題へ</button>
  </div>

  <div id="result-message" class="result"></div>
</div>

<script>
  let currentAnswerSec = 0; // 正解の合計秒数

  function generateProblem() {
    // 0分〜9分の間でランダムに開始時間を決定
    const min1 = Math.floor(Math.random() * 10);
    const sec1 = Math.floor(Math.random() * 60);
    const totalSec1 = min1 * 60 + sec1;
    
    // 1分以上の問題が出る確率を約20%に設定
    const isMinuteProblem = Math.random() < 0.2; 
    
    if (isMinuteProblem) {
      // 1分〜3分（60秒〜180秒）の間で差分を生成
      currentAnswerSec = Math.floor(Math.random() * 121) + 60; 
    } else {
      // 10秒〜59秒の間で差分を生成
      currentAnswerSec = Math.floor(Math.random() * 50) + 10; 
    }
    
    const totalSec2 = totalSec1 + currentAnswerSec;
    
    const min2 = Math.floor(totalSec2 / 60);
    const sec2 = totalSec2 % 60;
    
    // mm:ss 形式にフォーマット
    const formatTime = (m, s) => m + ":" + s.toString().padStart(2, '0');
    
    document.getElementById('time1').innerText = formatTime(min1, sec1);
    document.getElementById('time2').innerText = formatTime(min2, sec2);
    
    // UIのリセット
    document.getElementById('user-min').value = '';
    document.getElementById('user-sec').value = '';
    document.getElementById('result-message').innerText = '';
    document.getElementById('check-btn').style.display = 'inline-block';
    document.getElementById('next-btn').style.display = 'none';
    
    // 秒の入力欄にフォーカスを当てる
    document.getElementById('user-sec').focus();
  }

  function checkAnswer() {
    const minInput = document.getElementById('user-min').value;
    const secInput = document.getElementById('user-sec').value;
    
    // 入力が空の場合は0として扱う
    const userMin = minInput === '' ? 0 : parseInt(minInput, 10);
    const userSec = secInput === '' ? 0 : parseInt(secInput, 10);
    const resultMsg = document.getElementById('result-message');
    
    if (isNaN(userMin) || isNaN(userSec)) {
      resultMsg.innerText = "数字を入力してください";
      resultMsg.className = "result incorrect";
      return;
    }
    
    // ユーザーの入力を合計秒数に変換
    const userTotalSec = (userMin * 60) + userSec;
    
    // 正解の文字列を作成
    const targetMin = Math.floor(currentAnswerSec / 60);
    const targetSec = currentAnswerSec % 60;
    let answerText = "";
    if (targetMin > 0) {
      answerText += targetMin + "分";
    }
    answerText += targetSec + "秒";

    if (userTotalSec === currentAnswerSec) {
      resultMsg.innerText = "大正解！ （" + answerText + "）";
      resultMsg.className = "result correct";
      document.getElementById('check-btn').style.display = 'none';
      document.getElementById('next-btn').style.display = 'inline-block';
      document.getElementById('next-btn').focus();
    } else {
      resultMsg.innerText = "惜しい！もう一度計算してみよう";
      resultMsg.className = "result incorrect";
    }
  }

  // Enterキーを押した時の動作
  function handleKeyPress(e) {
    if (e.key === 'Enter') {
      if (document.getElementById('check-btn').style.display !== 'none') {
        checkAnswer();
      }
    }
  }
  document.getElementById('user-min').addEventListener('keypress', handleKeyPress);
  document.getElementById('user-sec').addEventListener('keypress', handleKeyPress);

  // 初回読み込み時に1問目を生成
  window.onload = generateProblem;
</script>

</body>
</html>
